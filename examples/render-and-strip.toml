[server]
host = "127.0.0.1"
port = 8000

[playwright_mcp]
endpoint = "https://playwright-mcp.example/mcp"

[llm]
model = "openai/model-name"
api_base = "https://model.example/v1"
api_key = "replace-with-an-environment-secret"
max_output_tokens = 1024

[agent]
allow_plain_http = false
max_concurrent_invocations = 0
max_model_turns = 12
max_browser_actions = 30
total_timeout_seconds = 600
navigation_timeout_seconds = 20
browser_action_timeout_seconds = 15
model_request_timeout_seconds = 90
page_settle_seconds = 2
cleanup_timeout_seconds = 10

[output]
max_html_bytes = 0

[progress]
reasoning_progress_max_items = 0
reasoning_progress_min_interval_seconds = 0

[logging]
level = "INFO"
