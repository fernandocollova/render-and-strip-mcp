[project]
name = "render-and-strip-mcp"
version = "0.1.0"
description = "A Streamable HTTP MCP tool for browser-guided semantic HTML rendering."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "beautifulsoup4==4.14.3",
    "fastmcp==3.4.5",
    "litellm==1.95.0",
    "openai==2.20.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.1",
]

[project.scripts]
render-and-strip-mcp = "render_and_strip_mcp.cli:cli"

[build-system]
requires = ["uv_build==0.9.20"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "render_and_strip_mcp"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--cov=render_and_strip_mcp",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]
markers = [
    "integration: requires running Compose infrastructure",
]

[tool.coverage.run]
branch = true
source = ["render_and_strip_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
